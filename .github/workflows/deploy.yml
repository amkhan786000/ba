# Build & deploy to the Contabo server.
#
#  - Every merge to main: builds the backend and frontend Docker images and stores them in
#    GitHub Container Registry (ghcr.io), tagged with the commit SHA. Nothing is deployed.
#  - "Run workflow" (Actions tab -> Build & deploy -> Run workflow): builds main and deploys it.
#    Fill in "tag" with an older commit SHA to roll back to that version instead (no build).
#
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   CONTABO_HOST      server IP address
#   CONTABO_USER      SSH user on the server (deploy)
#   CONTABO_SSH_KEY   private SSH key whose public half is in ~deploy/.ssh/authorized_keys
#   CONTABO_SSH_PORT  optional, defaults to 22
#   MAIL_USERNAME / MAIL_PASSWORD / MAIL_FROM  optional, Gmail address + app password for e-mails
# The server's .env (DB passwords, JWT secret) is created automatically on the first deploy.
# Server setup: deploy/README.md

name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy an existing image tag (commit SHA) instead of building main - use to roll back"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: Build images
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rahbar-${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/rahbar-${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRY }}/rahbar-${{ matrix.app }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy to Contabo
    if: github.event_name == 'workflow_dispatch' && !cancelled() && !failure()
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.tag != '' && inputs.tag || github.sha }}
      SSH_PORT: ${{ secrets.CONTABO_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the server secrets are set
        env:
          HOST: ${{ secrets.CONTABO_HOST }}
          USER: ${{ secrets.CONTABO_USER }}
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing CONTABO_HOST"
          [ -n "$USER" ] || missing="$missing CONTABO_USER"
          [ -n "$KEY" ]  || missing="$missing CONTABO_SSH_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see deploy/README.md)"; exit 1; fi

      - name: Set up SSH
        env:
          KEY: ${{ secrets.CONTABO_SSH_KEY }}
          HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host contabo\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n' \
            "$HOST" "${{ secrets.CONTABO_USER }}" "$SSH_PORT" > ~/.ssh/config

      - name: Copy the deployment files
        run: |
          scp -q deploy/docker-compose.prod.yml deploy/Caddyfile deploy/deploy.sh deploy/.env.production.example contabo:/opt/rahbar/
          ssh contabo 'chmod +x /opt/rahbar/deploy.sh'

      - name: Sign the server in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This run's short-lived token goes over stdin (never on a command line); it is removed again below.
          printf '%s' "$GHCR_TOKEN" | ssh contabo "docker login ghcr.io -u '${{ github.actor }}' --password-stdin" >/dev/null

      - name: Send the mail settings (optional secrets)
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          # Goes over stdin into a private file that deploy.sh merges into .env and then deletes.
          if [ -z "$MAIL_USERNAME$MAIL_PASSWORD$MAIL_FROM" ]; then echo "No MAIL_* secrets set - skipping."; exit 0; fi
          printf 'MAIL_USERNAME=%s\nMAIL_PASSWORD=%s\nMAIL_FROM=%s\n' "$MAIL_USERNAME" "${MAIL_PASSWORD// /}" "$MAIL_FROM" \
            | ssh contabo 'umask 077; cat > /opt/rahbar/.incoming-secrets'

      - name: Deploy ${{ env.TAG }}
        run: |
          set -o pipefail
          if ssh contabo "REGISTRY='${{ env.REGISTRY }}' /opt/rahbar/deploy.sh '${TAG}'" 2>&1 | tee deploy.log; then
            exit 0
          fi
          # Put the reason on the run page (annotations are visible without opening the log).
          set +e +o pipefail
          reason="$(grep -E '\[deploy|ERROR|error|denied|No such|not found|unhealthy' deploy.log | tail -n 8 | tr '\n' ' ' | cut -c1-900)"
          echo "::error title=Deploy failed::${reason:-see the step log}"
          echo "::error title=Last output::$(tail -n 15 deploy.log | tr '\n' ' ' | cut -c1-900)"
          exit 1

      - name: Sign the server out of ghcr.io
        if: always()
        run: ssh contabo 'docker logout ghcr.io >/dev/null 2>&1 || true' || true

      - name: Summary
        if: always()
        env:
          HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo "- Version: \`${TAG}\`"
            echo "- Server: ${HOST}"
          } >> "$GITHUB_STEP_SUMMARY"

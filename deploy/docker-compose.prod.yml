# Production stack for the Contabo server. Images are built by GitHub Actions
# (.github/workflows/deploy.yml) and pulled from GitHub Container Registry;
# nothing is compiled on the server. Settings come from /opt/rahbar/.env.
#
# Run from /opt/rahbar:  docker compose -f docker-compose.prod.yml up -d
# (deploy.sh does this for you, with a backup first and a rollback on failure).

name: rahbar

services:
  mysql:
    image: mysql:8.0
    container_name: rahbar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in /opt/rahbar/.env}
      MYSQL_DATABASE: ${DB_NAME:-rahbar}
      MYSQL_USER: ${DB_USER:-rahbar}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in /opt/rahbar/.env}
    # Only reachable from the server itself (127.0.0.1), never from the internet. For DBeaver etc. use an
    # SSH tunnel to the server and connect to localhost:3307 (DB_TUNNEL_PORT in .env to change it).
    ports:
      - "127.0.0.1:${DB_TUNNEL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: ${REGISTRY:-ghcr.io/amkhan786000}/rahbar-backend:${TAG:-latest}
    container_name: rahbar-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-rahbar}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER:-rahbar}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in /opt/rahbar/.env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      LOG_OTP: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost}
      UPLOAD_DIR: /app/uploads
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xms256m -Xmx768m}
    # No published port: nginx (frontend) proxies /api and /uploads to it.
    volumes:
      - uploads:/app/uploads

  frontend:
    image: ${REGISTRY:-ghcr.io/amkhan786000}/rahbar-frontend:${TAG:-latest}
    container_name: rahbar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Without a domain the site is served straight on port 80 (http://<server-ip>).
      # With HTTPS (see deploy/README.md) set HTTP_BIND=127.0.0.1:8081 so only Caddy faces the internet.
      - "${HTTP_BIND:-80}:80"

  # Optional HTTPS with a free Let's Encrypt certificate. Needs a domain pointing to the server:
  # set DOMAIN, HTTP_BIND=127.0.0.1:8081 and COMPOSE_PROFILES=https in /opt/rahbar/.env.
  caddy:
    image: caddy:2-alpine
    container_name: rahbar-caddy
    restart: unless-stopped
    profiles: ["https"]
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  uploads:
  caddy-data:
  caddy-config:

# Security headers for every answer (included in the server block and in each location that sets its own headers,
# because nginx drops the server's add_header lines in a location that has any).
# Content-Security-Policy: scripts only from Rahbar itself and Razorpay's payment window (no inline scripts, so an
# injected script can't run or send the sign-in token anywhere); styles and fonts also from Google Fonts; the page
# can't be shown inside another site (clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://*.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.razorpay.com; frame-src 'self' blob: https://*.razorpay.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.razorpay.com\" \"https://api.razorpay.com\")" always;

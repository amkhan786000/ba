# Behind Caddy (HTTPS) the request reaches nginx as plain HTTP: keep Caddy's X-Forwarded-Proto ("https") so the backend
# knows the site was opened over HTTPS (e.g. to mark the "remember this device" cookie Secure); otherwise use our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # Proxy API calls to the backend container (service name "backend" in docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # uploads: application documents (25 MB in the backend) and website photos (10 MB)
        client_max_body_size 26m;
    }

    # Angular client-side routing: fall back to index.html
    # The push notification service worker must never be cached, so updates reach browsers straight away.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

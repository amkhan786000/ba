<div class="d-flex justify-content-center align-items-center" style="min-height:100vh;">
  <div class="card shadow-sm" style="width: 380px;">
    <div class="card-body p-4">
      <h4 class="mb-3 text-center">Rahbar — Sign in</h4>
      <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>
      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Login with</label>
          <select class="form-control" [(ngModel)]="loginMethod" name="loginMethod">
            <option value="email">Email</option>
            <option value="phone">Phone</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">{{ loginMethod === 'email' ? 'Email' : 'Phone' }}</label>
          <input class="form-control" name="identifier" [(ngModel)]="identifier" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" [(ngModel)]="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit" [disabled]="loading">
          {{ loading ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>
      <div class="d-flex justify-content-between mt-3">
        <a routerLink="/reset-password">Forgot password?</a>
        <a routerLink="/register">Create account</a>
      </div>
    </div>
  </div>
</div>

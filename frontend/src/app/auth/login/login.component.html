<app-auth-layout heading="Welcome back" subheading="Sign in to continue to your Rahbar dashboard.">
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <form (ngSubmit)="submit()">
    <div class="segmented" role="tablist" aria-label="Sign in with">
      <button type="button" [class.active]="loginMethod === 'email'" (click)="loginMethod = 'email'">
        <i class="mdi mdi-email-outline"></i>Email
      </button>
      <button type="button" [class.active]="loginMethod === 'phone'" (click)="loginMethod = 'phone'">
        <i class="mdi mdi-cellphone"></i>Phone
      </button>
    </div>
    <div class="form-group">
      <label for="identifier">{{ loginMethod === 'email' ? 'Email address' : 'Phone number' }}</label>
      <div class="input-icon">
        <i class="mdi" [ngClass]="loginMethod === 'email' ? 'mdi-email-outline' : 'mdi-cellphone'"></i>
        <input class="form-control" id="identifier" name="identifier" [(ngModel)]="identifier" required
               [type]="loginMethod === 'email' ? 'email' : 'tel'"
               [placeholder]="loginMethod === 'email' ? 'you@example.com' : '10-digit mobile number'"
               [attr.autocomplete]="loginMethod === 'email' ? 'email' : 'tel'">
      </div>
    </div>
    <div class="form-group">
      <div class="d-flex justify-content-between align-items-center">
        <label for="password">Password</label>
        <a routerLink="/reset-password" class="small font-weight-bold mb-1">Forgot password?</a>
      </div>
      <div class="input-icon">
        <i class="mdi mdi-lock-outline"></i>
        <input class="form-control" id="password" type="password" name="password" [(ngModel)]="password"
               placeholder="Your password" autocomplete="current-password" required>
      </div>
    </div>
    <button class="btn btn-primary btn-block mt-4" type="submit" [disabled]="loading">
      <span *ngIf="loading" class="spinner-border spinner-border-sm mr-2"></span>{{ loading ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
  <div class="auth-links center">
    <span class="text-muted font-weight-normal mr-1">New to Rahbar?</span><a routerLink="/register">Create an account</a>
  </div>
  <div class="auth-links center mt-2">
    <a routerLink="/apply"><i class="mdi mdi-file-document-edit-outline mr-1"></i>Apply for a scholarship</a>
    <a routerLink="/track-application"><i class="mdi mdi-magnify mr-1"></i>Track an application</a>
  </div>
</app-auth-layout>

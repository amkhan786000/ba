<app-auth-layout heading="Check your email" subheading="We sent a 6-digit code to the email on your account. It is valid for 5 minutes.">
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <form (ngSubmit)="submit()">
    <div class="form-group">
      <label for="otp">Verification code</label>
      <input class="form-control otp-input" id="otp" name="otp" [(ngModel)]="otp" placeholder="••••••"
             inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
    </div>
    <div class="custom-control custom-checkbox mt-3" *ngIf="rememberDays > 0">
      <input type="checkbox" class="custom-control-input" id="remember" name="remember" [(ngModel)]="remember">
      <label class="custom-control-label" for="remember">
        Remember this device for {{ rememberDays }} days
        <small class="d-block text-muted">You won't need a code here until then; your password is still asked.
          Don't tick this on a shared or public computer.</small>
      </label>
    </div>
    <button class="btn btn-primary btn-block mt-4" type="submit" [disabled]="loading">
      <span *ngIf="loading" class="spinner-border spinner-border-sm mr-2"></span>{{ loading ? 'Verifying…' : 'Verify and continue' }}
    </button>
  </form>
  <div class="auth-links center"><a routerLink="/login"><i class="mdi mdi-arrow-left mr-1"></i>Back to sign in</a></div>
</app-auth-layout>

server:
  port: ${SERVER_PORT:5000}
  # Behind nginx: trust X-Forwarded-* only from private-network proxies (used for the activity log's IP address)
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/rahbar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-before-deploying-to-production}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@rahbar.org}
    # Local testing without SMTP: set LOG_OTP=true to also print sign-in OTPs in the backend log. Never in production.
    log-otp: ${LOG_OTP:false}
  reminders:
    # Payment reminders job (sec min hour day month weekday), server time. Default: every day at 08:00.
    cron: ${REMINDERS_CRON:0 0 8 * * *}

logging:
  level:
    com.rahbar: INFO

services:
  mysql:
    image: mysql:8.0
    container_name: rahbar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-rahbar}
      MYSQL_USER: ${DB_USER:-rahbar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rahbarpass}
    ports:
      - "3307:3306"
    volumes:
      - rahbar-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: rahbar-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-rahbar}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER:-rahbar}
      DB_PASSWORD: ${DB_PASSWORD:-rahbarpass}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-before-deploying-to-production}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@rahbar.org}
      # Local testing without SMTP: LOG_OTP=true prints sign-in OTPs in the backend log (never in production)
      LOG_OTP: ${LOG_OTP:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      UPLOAD_DIR: /app/uploads
      SERVER_PORT: 8080
    volumes:
      - rahbar-uploads:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: rahbar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  rahbar-mysql-data:
  rahbar-uploads:
